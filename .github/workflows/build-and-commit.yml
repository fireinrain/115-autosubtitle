name: Build and Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - dist/115-subtitle-assistant.user.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Commit and push dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/115-subtitle-assistant.user.js
          if git diff --cached --quiet; then
            echo "No changes to dist, skip commit"
          else
            git commit -m "build: update dist to ${{ steps.version.outputs.version }} [skip ci]"
            git push
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: dist/115-subtitle-assistant.user.js
          generate_release_notes: true
          prerelease: false